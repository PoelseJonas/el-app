version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates go through staging like any other change, never straight to main.
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node must match the Node major in .nvmrc (24). Bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates arrive as one PR per week. Major updates get their own PR.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
